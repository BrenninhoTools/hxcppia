name: Testing
on:
  push:
    branches: main
  workflow_dispatch:
jobs:
  Test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Native test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            g++ -std=c++17 -Iproject/include project/tests/native_test.cpp project/src/hxcppia.cpp -o native_test.exe && ./native_test.exe
          else
            c++ -std=c++17 -Iproject/include project/tests/native_test.cpp project/src/hxcppia.cpp -o native_test && ./native_test
          fi

      - name: Install hxcpp
        run: |
          haxelib install hxcpp --quiet
          haxelib dev hxcppia .

      - name: Build host
        run: haxe host.hxml

      - name: Build script
        run: haxe script.hxml

      - name: Run
        shell: bash
        run: |
          if [ -f tests/bin/host/Host.exe ]; then tests/bin/host/Host.exe; else tests/bin/host/Host; fi

      - name: Tool
        shell: bash
        run: |
          haxelib run hxcppia new Demo tests/bin/demo
          test -f tests/bin/demo/Demo.hx
