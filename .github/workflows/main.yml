name: Testing
on:
  push:
    branches: main
  workflow_dispatch:
jobs:
  Test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install hxcpp
        run: haxelib install hxcpp --quiet

      - name: Build host
        run: haxe host.hxml

      - name: Build script
        run: haxe script.hxml

      - name: Run
        shell: bash
        run: |
          if [ -f tests/bin/host/Host.exe ]; then tests/bin/host/Host.exe; else tests/bin/host/Host; fi

      - name: Tool
        shell: bash
        run: |
          haxelib dev hxcppia .
          haxelib run hxcppia new Demo tests/bin/demo
          test -f tests/bin/demo/Demo.hx
